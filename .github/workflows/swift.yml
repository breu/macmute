name: Swift

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4
    - name: Lint packaging scripts
      run: |
        command -v shellcheck >/dev/null || brew install shellcheck
        shellcheck Scripts/*.sh
    - name: Build Swift package in release mode
      run: swift build -c release -Xswiftc -warnings-as-errors
    - name: Run release tests and coverage gate
      run: bash Scripts/check_release.sh
    - name: Build Xcode Release app
      run: |
        xcodebuild -project Brute.xcodeproj -scheme Brute -configuration Release \
          -destination 'platform=macOS' CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= \
          SWIFT_TREAT_WARNINGS_AS_ERRORS=YES build
    - name: Run Xcode tests
      run: |
        # The app hosts tests that spawn shell commands, so omit its sandbox entitlements here.
        xcodebuild -project Brute.xcodeproj -scheme Brute \
          -destination 'platform=macOS' CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= \
          ENABLE_APP_SANDBOX=NO CODE_SIGN_ENTITLEMENTS= \
          SWIFT_TREAT_WARNINGS_AS_ERRORS=YES test
